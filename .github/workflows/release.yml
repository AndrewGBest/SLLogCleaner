name: Release

# Builds a stand-alone executable for every platform and attaches them to a
# GitHub release.  Runs when a tag such as "v1.0.0" is pushed; a manual run
# (workflow_dispatch) builds the executables without publishing anything.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyInstaller cannot cross-compile, so each target needs its own
          # runner.  Linux uses the oldest image so the binary runs on older
          # glibc versions too.
          - { os: ubuntu-22.04,   target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest,   target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest pyinstaller
      - run: python -m pytest
      - name: Check that the tag matches the version in the source
        if: github.ref_type == 'tag'
        run: test "v$(python sllogcleaner.py --version | cut -d' ' -f2)" = "$GITHUB_REF_NAME"
      - name: Build executable
        run: pyinstaller --onefile --console --name sllogcleaner sllogcleaner.py
      - name: Smoke-test executable
        run: ./dist/sllogcleaner --version
      - name: Package
        run: |
          mkdir package
          cp dist/sllogcleaner* README.md package/
          python -c "import shutil, sys; shutil.make_archive('sllogcleaner-${{ matrix.target }}', 'zip' if sys.platform == 'win32' else 'gztar', 'package')"
      - uses: actions/upload-artifact@v4
        with:
          name: sllogcleaner-${{ matrix.target }}
          path: |
            sllogcleaner-${{ matrix.target }}.zip
            sllogcleaner-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          --title "SL Log Cleaner $GITHUB_REF_NAME"
