name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          # Oldest supported Python.
          - os: ubuntu-22.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # Fail, rather than skip, the window test if no window can be opened.
      SLLOGCLEANER_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Run tests
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a python -m pytest -v
          else
            python -m pytest -v
          fi
